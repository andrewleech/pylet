[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picolet"
version = "0.0.1"
description = "Compile Python programs to small self-contained native binaries via MicroPython"
readme = "README.md"
license = { text = "MIT" }
# 3.11.4 is the floor, not 3.11.0: tarfile's extraction-filter security fix
# (PEP 706 / CVE-2007-4559 remediation) was backported to 3.11.4, and
# picolet.cli._mpy_lib_cache relies on tarfile.extractall(filter="data")
# unconditionally, with no pre-3.12 fallback path.
requires-python = ">=3.11.4"
authors = [
    { name = "Andrew Leech", email = "andrew@alelec.net" },
]
keywords = ["micropython", "binary", "bundler", "freeze", "webview", "lvgl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mpremote",
    "pefile>=2023.2.7",  # Windows PE resource surgery for [app] icon embedding
    # picolet.testing optional dep group below provides playwright/websockets/
    # pillow.  The CLI's `picolet test` works without those (it can still spawn
    # binaries + read stdout); the harness is needed only for screenshot /
    # webview-driving flows.
]

[project.optional-dependencies]
testing = [
    "playwright>=1.40",
    "websockets>=12.0",
    "pillow>=10.0",
]

[project.scripts]
picolet = "picolet.__main__:main"

[project.urls]
Homepage = "https://github.com/andrewleech/picolet"
Source = "https://github.com/andrewleech/picolet"
Issues = "https://github.com/andrewleech/picolet/issues"

[tool.hatch.build.targets.wheel]
packages = ["picolet"]
# Templates ship as resource files inside the wheel — picolet.templates uses
# importlib.resources.files() at runtime.  They're naturally part of the
# `picolet` package collection above (since they live at picolet/templates/),
# so no explicit force-include is needed.

# Bridge.js + runtime SBOM data live in sibling workspace packages
# (picolet-bridge-js, picolet-runtime).  hatch_build.py copies them into
# the picolet/ tree at build start so they ship inside both sdist and
# wheel.  Once present they're enumerated as ordinary package files; no
# force-include needed.  Destination paths are .gitignored so dev builds
# stay clean.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
